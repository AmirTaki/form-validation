<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM VALIDATION</title>
    <link rel="stylesheet" href="./src/styles.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <div class="container">
        <div class="box">
            <header class = 'signup-header'>
                <h1>Signup</h1>
            </header>
            <main class = "signup-body">
                <form action="#">
                    <p>
                        <label for="name">Full Name</label>
                        <input type="text" name="" id="name" placeholder="Type Name Here" >
                        <i class="bi " ></i>
                        <span id = 'nameError'></span>
                    </p>
                    
                    <p>
                        <label for="email">Email</label>
                        <input type="email" name="" id="email" placeholder="xyz@gmail.com" >
                        <i class="bi" style="top: 205px;"></i>
                        <span id = 'emailError'></span>
                    </p>
                    
                    <p>
                        <label for="password">Password</label>
                        <input type="password" name="" id="password" placeholder="at last 8 characters"  >
                        <i class="bi" style="top : 290px"></i>
                        <span id = 'passError'></span>
                    </p>
                    <p>
                        <input type="submit" value = 'Create Account' id = 'submitBtn'>
                    </p>
                </form>
            </main>
            <footer class = 'sigup-footer'>
                <p>Already have an account ? <a href="#">Login</a></p>
            </footer>
        </div>
    </div>
    <script src = "./src/main.js"></script>
</body>
</html>
